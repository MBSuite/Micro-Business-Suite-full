# ============================================================
# Micro Business Suite — Docker Compose (production delivery)
#   app   : Next.js standalone (build from Dockerfile)
#   db    : ใช้ stack-db ของ sv (Phase 0.5) — ไม่มี container DB ของตัวเองแล้ว
#
# วิธีใช้:
#   cp .env.example .env.local
#   # แก้ .env.local: LICENSE_SALT, MBS_LICENSE_KEY, NEXTAUTH_SECRET,
#   #   DATABASE_URL=postgresql://mbs:mbs@db:5432/mbs?sslmode=disable
#   docker compose up -d --build
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbs-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # DB — stack-db บนเครือข่าย stack_stack (sslmode=disable)
      POSTGRES_URL: ${BILLING_DATABASE_URL}
      DATABASE_URL: ${BILLING_DATABASE_URL}
      # Auth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-86400}
      # Product / License
      PRODUCT_MODE: ${PRODUCT_MODE:-perpetual}
      LICENSE_SALT: ${LICENSE_SALT}
      MBS_LICENSE_KEY: ${MBS_LICENSE_KEY}
      # Google OAuth (ไม่บังคับ — เว้นว่างได้ถ้ายังไม่ตั้ง)
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      NEXT_PUBLIC_GOOGLE_API_KEY: ${NEXT_PUBLIC_GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMAIL_FROM: ${GMAIL_FROM:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      CRON_ENABLED: ${CRON_ENABLED:-false}
      RECURRING_SECRET: ${RECURRING_SECRET:-}
    # เข้าผ่าน HTTPS ผ่าน Tailscale Serve เท่านั้น
    # https://sv.tail7b4d4a.ts.net:8443 -> proxy -> 127.0.0.1:3001
    # ผูกแค่ loopback = เข้าตรงผ่าน LAN/Tailscale IP ไม่ได้
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - stack
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  stack:
    external: true
    name: stack_stack
